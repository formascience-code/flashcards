<div id="fc">
<style>
#fc{max-width:640px;margin:auto;padding:16px;font-family:Arial,Helvetica,sans-serif;color:#4a3a22;text-align:center}
#fc img.logo{width:220px;max-width:70%;height:auto}
#fc h2{font-size:26px;margin:8px 0 12px}
#fc select{padding:9px 12px;border:1px solid #d8cfbf;border-radius:8px;font-size:15px;color:#4a3a22;background:#fff}
#fc .compteur{color:#c2a05a;font-weight:bold;margin:12px 0}
#fc .carte{position:relative;height:320px;cursor:pointer;user-select:none;-webkit-perspective:1200px;perspective:1200px}
#fc .interieur{position:absolute;inset:0;-webkit-transform-style:preserve-3d;transform-style:preserve-3d;-webkit-transition:-webkit-transform .6s ease;transition:transform .6s ease}

#fc .face{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden;background:#fff;border-radius:16px;box-shadow:0 6px 20px rgba(74,58,34,.15);padding:20px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;align-items:center;overflow:auto}

@media (prefers-reduced-motion:reduce){#fc .interieur{-webkit-transition:none;transition:none}}
#fc .type{font-size:14px;color:#a08348;margin-bottom:10px}
#fc .formule{max-width:100%;overflow-x:auto}
#fc .formule svg{display:block;margin:auto}
#fc .nom{font-size:30px;font-weight:bold;margin-bottom:8px}
#fc .petit{font-size:17px;color:#7a6a52;line-height:1.5}
#fc .aide{margin-top:14px;font-size:13px;color:#888}
#fc .boutons{display:flex;justify-content:center;gap:10px;margin-top:18px;flex-wrap:wrap}
#fc button{background:#c2a05a;color:#fff;border:none;padding:11px 20px;border-radius:10px;font-size:15px;font-weight:bold;cursor:pointer}
#fc button:focus-visible,#fc .carte:focus-visible,#fc select:focus-visible{outline:3px solid #4a3a22;outline-offset:2px}
</style>

<script>
/* ===== Dessin des formules =====
   Toutes les formules sont dessinees a l'echelle 1 : les lettres des atomes
   ont donc exactement la meme taille sur toutes les cartes.
   Une molecule = une liste d'atomes [x, y, "texte"] ("" = sommet topologique)
   et une liste de liaisons [atome1, atome2, ordre]. */

var TAILLE = 22;            // taille des lettres des atomes (px)
var TAILLE_INDICE = 15;     // taille des chiffres en indice / charges

// "CH3" -> C H et 3 en indice ; "O^-" -> O et charge en exposant
function texteAtome(s){
  var html = '', largeur = 0, decalage = 0, i, c, cible, petit, sup = false;
  for (i = 0; i < s.length; i++) {
    c = s[i];
    if (c === '^') { sup = true; continue; }
    petit = sup || /[0-9]/.test(c);
    cible = sup ? -8 : (petit ? 6 : 0);
    html += '<tspan dy="' + (cible - decalage) + '"' + (petit ? ' font-size="' + TAILLE_INDICE + '"' : '') + '>' + c + '</tspan>';
    decalage = cible;
    largeur += petit ? 9 : (c === "'" ? 5 : 15);
  }
  return { html: html, largeur: largeur };
}

function dessiner(atomes, liaisons){
  var infos = atomes.map(function(a){
    var t = texteAtome(a[2]);
    return { x: a[0], y: a[1], html: t.html, dl: a[2] ? t.largeur / 2 + 2 : 0, dh: a[2] ? 12 : 0 };
  });
  var svg = '', minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9;

  // Liaisons (raccourcies pour ne pas toucher les lettres)
  liaisons.forEach(function(b){
    var A = infos[b[0]], B = infos[b[1]];
    var dx = B.x - A.x, dy = B.y - A.y, L = Math.sqrt(dx*dx + dy*dy), ux = dx/L, uy = dy/L;
    function retrait(P){
      if (!P.dl) return 0;
      var s1 = Math.abs(ux) > 1e-6 ? P.dl / Math.abs(ux) : 1e9;
      var s2 = Math.abs(uy) > 1e-6 ? P.dh / Math.abs(uy) : 1e9;
      return Math.min(s1, s2) + 3;
    }
    var ra = retrait(A), rb = retrait(B);
    var x1 = A.x + ux*ra, y1 = A.y + uy*ra, x2 = B.x - ux*rb, y2 = B.y - uy*rb;
    var decal = b[2] === 2 ? [-3.5, 3.5] : [0];
    decal.forEach(function(d){
      svg += '<line x1="' + (x1 - uy*d) + '" y1="' + (y1 + ux*d) + '" x2="' + (x2 - uy*d) + '" y2="' + (y2 + ux*d) +
             '" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>';
    });
  });

  // Atomes
  infos.forEach(function(a){
    minX = Math.min(minX, a.x - a.dl); maxX = Math.max(maxX, a.x + a.dl);
    minY = Math.min(minY, a.y - Math.max(a.dh, 2)); maxY = Math.max(maxY, a.y + Math.max(a.dh, 2));
    if (a.html) svg += '<text x="' + a.x + '" y="' + (a.y + 8) + '" font-size="' + TAILLE +
      '" font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="currentColor">' + a.html + '</text>';
  });

  var m = 8, w = maxX - minX + 2*m, h = maxY - minY + 2*m;
  return '<svg width="' + w + '" height="' + h + '" viewBox="' + (minX - m) + ' ' + (minY - m) + ' ' + w + ' ' + h + '">' + svg + '</svg>';
}

var toutes = DONNEES.map(function(d){
  var f = FONCTIONS[d[0]];
  return {
    type: d[1],
    recto: '<div class="type">' + TYPES[d[1]] + '</div><div class="formule">' + dessiner(d[3], d[4]) + '</div>',
    verso: '<div class="nom">' + f.nom + '</div><div class="petit">' + f.groupe + (d[2] ? '<br>Mol\u00e9cule : ' + d[2] : '') + '</div>'
  };
});

/* ===== Fonctionnement des cartes ===== */
var cartes = toutes.slice();
var i = 0;
var carte = document.getElementById('carte');

// Affiche la carte numero i, cote formule, sans animation
function afficher(){
  carte.classList.add('sans-anim');
  carte.classList.remove('retournee');
  document.getElementById('recto').innerHTML = cartes[i].recto;
  document.getElementById('verso').innerHTML = cartes[i].verso;
  document.getElementById('compteur').innerHTML = 'Carte ' + (i + 1) + ' / ' + cartes.length;
  void carte.offsetWidth;
  carte.classList.remove('sans-anim');
}
function aller(pas){ i = (i + pas + cartes.length) % cartes.length; afficher(); }
function retourner(){ carte.classList.toggle('retournee'); }

document.getElementById('carte').onclick = retourner;
document.getElementById('carte').onkeydown = function(e){ if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); retourner(); } };
document.getElementById('prec').onclick = function(){ aller(-1); };
document.getElementById('suiv').onclick = function(){ aller(1); };
document.getElementById('melanger').onclick = function(){
  for (var k = cartes.length - 1; k > 0; k--) { var j = Math.floor(Math.random() * (k + 1)); var t = cartes[k]; cartes[k] = cartes[j]; cartes[j] = t; }
  i = 0; afficher();
};
document.getElementById('filtre').onchange = function(){
  var v = this.value;
  cartes = toutes.filter(function(c){ return !v || c.type === v; });
  i = 0; afficher();
};

afficher();
</script>
